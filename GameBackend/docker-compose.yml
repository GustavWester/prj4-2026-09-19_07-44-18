# Game Database på port 1434, så den ikke kolliderer med Website-databasen på 1433
services:
  gamedb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: game-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - gamedb-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  gamedb-data: