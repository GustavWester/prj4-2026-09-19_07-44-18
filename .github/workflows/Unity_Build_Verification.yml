name: Unity_Build_Verification_v2.3.1

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      verify_failure:
        description: "Run the deliberately failing test and expect the runner to report failure"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: ${{ !inputs.verify_failure }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: StandaloneWindows64
            build_name: Windows
            build_path: build/Windows/Game.exe
            modules: windows-mono
          - os: macos-latest
            platform: StandaloneOSX
            build_name: macOS
            build_path: build/macOS/Game.app
            modules: mac-mono
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Mono2x-${{ matrix.os }}-Build-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Mono2x-${{ matrix.os }}-Build-

      - name: Install Unity Hub and Editor
        uses: RageAgainstThePixel/unity-setup@v2.6.0
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          modules: ${{ matrix.modules }}
          auto-update-hub: false
          cache-installation: true

      - name: Activate Unity license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Warm up Library (prime asset import)
        if: ${{ matrix.platform == 'StandaloneWindows64' }}
        shell: bash
        run: |
          editor_path="$(cygpath -u "$UNITY_EDITOR_PATH")"
          "$editor_path" -batchmode -nographics -quit -projectPath "$PWD" \
            -scriptingBackend Mono2x \
            -logFile -

      - name: Run PlayMode smoke test
        if: ${{ matrix.platform == 'StandaloneWindows64' }}
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p results

          editor_path="$(cygpath -u "$UNITY_EDITOR_PATH")"
          project_path="$(cygpath -w "$PWD")"
          results_path="$(cygpath -w "$PWD/results/smoke-results.xml")"

          set +e
          "$editor_path" \
            -batchmode \
            -nographics \
            -projectPath "$project_path" \
            -buildTarget StandaloneWindows64 \
            -scriptingBackend Mono2x \
            -runTests \
            -testPlatform PlayMode \
            -testCategory Smoke \
            -testResults "$results_path" \
            -logFile -
          code=$?
          set -e

          echo "Unity exited with code $code"

          if [ ! -f results/smoke-results.xml ]; then
            echo "::error::Unity did not produce results/smoke-results.xml"
            exit 1
          fi

          if ! grep -Eq 'total="[1-9][0-9]*"' results/smoke-results.xml; then
            echo "::error::No PlayMode smoke tests were executed"
            exit 1
          fi

          exit "$code"

      - name: Upload smoke test results
        if: ${{ always() && matrix.platform == 'StandaloneWindows64' }}
        uses: actions/upload-artifact@v4
        with:
          name: playmode-smoke-results-windows
          path: results
          if-no-files-found: warn

      - name: Build player
        shell: bash
        env:
          UNITY_BUILD_TARGET: ${{ matrix.platform }}
        run: |
          mkdir -p "build/${{ matrix.build_name }}"
          editor_path="$UNITY_EDITOR_PATH"
          build_path="$PWD/${{ matrix.build_path }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            editor_path="$(cygpath -u "$UNITY_EDITOR_PATH")"
            build_path="$(cygpath -w "$build_path")"
          fi
          export UNITY_BUILD_PATH="$build_path"
          "$editor_path" -batchmode -nographics -quit -projectPath "$PWD" \
            -scriptingBackend Mono2x \
            -buildTarget "${UNITY_BUILD_TARGET}" \
            -executeMethod CiBuild.Build \
            -logFile -

      - name: Confirm build output
        shell: bash
        run: test -e "${{ matrix.build_path }}"

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-${{ matrix.build_name }}
          path: build/${{ matrix.build_name }}
          if-no-files-found: error

  verify-failure:
    name: Pipeline catches failures (Windows)
    if: ${{ inputs.verify_failure }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      - name: Install Unity Hub and Editor
        uses: RageAgainstThePixel/unity-setup@v2.6.0
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          modules: ''
          auto-update-hub: false
          cache-installation: true

      - name: Activate Unity license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run deliberate failure test
        shell: bash
        run: |
          mkdir -p results
          editor_path="$(cygpath -u "$UNITY_EDITOR_PATH")"
          set +e
          "$editor_path" -batchmode -nographics -projectPath "$PWD" \
            -scriptingBackend Mono2x \
            -runTests -testPlatform EditMode \
            -testCategory "ShouldFail" \
            -testResults "$PWD/results/verify-failure.xml" \
            -logFile - -quit
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "::error::Expected exit code 2 but got $code"
            exit 1
          fi

      - name: Upload failure-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-results-windows
          path: results
          if-no-files-found: warn