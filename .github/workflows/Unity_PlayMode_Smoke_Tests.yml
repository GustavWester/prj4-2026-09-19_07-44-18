name: Unity_PlayMode_Smoke_Tests_v2.0

on:
  push:
    branches: [develop, SCRUM-21-combat-mod-enemies, SCRUM-37-ci-test-til-unity-projekt]
  pull_request:
    branches: [develop, SCRUM-21-combat-mod-enemies]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: PlayMode smoke test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Mono2x-windows-PlayMode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Mono2x-windows-PlayMode-

      - name: Install Unity Hub and Editor
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          cache-installation: true

      - name: Activate Unity license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run PlayMode smoke test
        shell: bash
        run: |
          mkdir -p results
          editor_path="$(cygpath -u "$UNITY_EDITOR_PATH")"
          set +e
          "$editor_path" -batchmode -nographics -projectPath "$PWD" \
            -scriptingBackend Mono2x \
            -runTests -testPlatform PlayMode \
            -testCategory "Smoke" \
            -testResults "$PWD/results/smoke-results.xml" \
            -logFile -
          code=$?
          echo "Unity exited with code $code"
          if [ "$code" -eq 0 ] && ! grep -q 'total="[1-9]' results/smoke-results.xml; then
            echo "::error::Unity reported success but ran 0 tests."
            exit 1
          fi
          exit $code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playmode-smoke-results-windows
          path: results
          if-no-files-found: warn