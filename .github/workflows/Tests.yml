name: Tests

# Kører projektets tests. Bygger IKKE spillet og booter ikke nogen scene
# (det gør Unity_Build_Verification). Se .github/TESTS.md for opsætning.
#
#  - Core unit tests: ren C# (Assets/Scripts/Core) med dotnet test. Ingen Unity, tager sekunder.
#  - Unity EditMode/PlayMode: kører i GameCI's Docker-image, hvor Unity allerede er installeret,
#    så der hentes/installeres aldrig en editor på runneren (det var ustabilt og langsomt).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Et nyt push til samme PR afbryder den forrige kørsel i stedet for at stå i kø.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # så testresultaterne vises som et check med detaljer på PR'en

jobs:
  core-unit-tests:
    name: Core unit tests (dotnet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test CoreTests/Game.Core.Tests.csproj --logger "trx;LogFileName=core-results.trx" --results-directory results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-unit-test-results
          path: results
          if-no-files-found: warn

  unity-tests:
    name: Unity ${{ matrix.testMode }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # testables i manifest.json gør Netcodes egne tests synlige. assemblies sørger for at kun vores køres.
        include:
          - testMode: EditMode
            assemblies: Tests.EditMode
          - testMode: PlayMode
            assemblies: Tests.PlayMode;Tests.Netcode
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      # Unity-imaget fylder ~5 GB og Library ~1 GB. Fjern store værktøjer runneren har med, som vi ikke bruger.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-linux-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.testMode }}-linux-

      - name: Run ${{ matrix.testMode }} tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Unity-versionen læses automatisk fra ProjectSettings/ProjectVersion.txt
          testMode: ${{ matrix.testMode }}
          # Smoke booter spillet, ShouldFail er pipeline-tjekket i build-workflowet.
          # INGEN anførselstegn: GameCI sender dem videre til Unity som en del af værdien,
          # og så bliver filteret '"!Smoke' (en inklusion), hvilket giver 0 kørte tests.
          customParameters: -testCategory !Smoke;!ShouldFail -assemblyNames ${{ matrix.assemblies }}
          artifactsPath: results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.testMode }} test results

      # Fanger at testene "består" fordi ingen blev kørt (fx hvis et filter eller en asmdef går i stykker).
      - name: Check that tests were executed
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          shopt -s nullglob
          files=(results/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Unity produced no test results"
            exit 1
          fi
          if ! grep -Eq 'total="[1-9][0-9]*"' "${files[@]}"; then
            echo "::error::No ${{ matrix.testMode }} tests were executed"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.testMode }}-test-results
          path: results
          if-no-files-found: warn
