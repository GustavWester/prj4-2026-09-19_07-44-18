name: Tests

# Kører projektets tests ved PRs. Bygger IKKE spillet og booter ikke nogen scene
# (det gør Unity_Build_Verification). Smoke- og ShouldFail-kategorierne springes over.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-unit-tests:
    # Ren C#-logik (Assets/Scripts/Core) med dotnet test - ingen Unity nødvendig, kører på sekunder.
    name: Core unit tests (dotnet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test CoreTests/Game.Core.Tests.csproj --logger "trx;LogFileName=core-results.trx" --results-directory results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-unit-test-results
          path: results
          if-no-files-found: warn

  unity-tests:
    # EditMode (asset-/prefab-validering) og PlayMode (komponenter i en tom testscene).
    name: Unity ${{ matrix.platform }} tests
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [EditMode, PlayMode]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Tests-windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Tests-windows-

      - name: Install Unity Hub and Editor
        uses: RageAgainstThePixel/unity-setup@v2.6.0
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          modules: ''
          auto-update-hub: false
          cache-installation: true

      - name: Activate Unity license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run ${{ matrix.platform }} tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p results
          editor_path="$(cygpath -u "$UNITY_EDITOR_PATH")"
          results_path="$(cygpath -w "$PWD/results/${{ matrix.platform }}-results.xml")"

          set +e
          "$editor_path" \
            -batchmode \
            -nographics \
            -projectPath "$(cygpath -w "$PWD")" \
            -runTests \
            -testPlatform ${{ matrix.platform }} \
            -testCategory "!Smoke;!ShouldFail" \
            -testResults "$results_path" \
            -logFile -
          code=$?
          set -e

          echo "Unity exited with code $code"
          if [ ! -f "results/${{ matrix.platform }}-results.xml" ]; then
            echo "::error::Unity did not produce a results file"
            exit 1
          fi
          if ! grep -Eq 'total="[1-9][0-9]*"' "results/${{ matrix.platform }}-results.xml"; then
            echo "::error::No ${{ matrix.platform }} tests were executed"
            exit 1
          fi
          exit "$code"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.platform }}-test-results
          path: results
          if-no-files-found: warn
