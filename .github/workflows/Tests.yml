name: Tests

# Kører projektets tests ved PRs. Bygger IKKE spillet og booter ikke nogen scene
# (det gør Unity_Build_Verification). Smoke- og ShouldFail-kategorierne springes over.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write # så en ødelagt Unity-installations-cache kan slettes automatisk

jobs:
  core-unit-tests:
    # Ren C#-logik (Assets/Scripts/Core) med dotnet test - ingen Unity nødvendig, kører på sekunder.
    name: Core unit tests (dotnet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test CoreTests/Game.Core.Tests.csproj --logger "trx;LogFileName=core-results.trx" --results-directory results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name:   # -----------------------------------------------------------------
  # Unity: installér editoren ÉN gang og tjek at den virker. Først derefter
  # kører EditMode og PlayMode parallelt og henter den færdige installation fra cachen.
  # -----------------------------------------------------------------
  prepare-unity:
    name: Prepare Unity
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      healthy: ${{ steps.check.outputs.healthy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Unity Hub and Editor
        id: setup
        continue-on-error: true # en timeout håndteres nedenfor i stedet for at stoppe hele kørslen
        uses: RageAgainstThePixel/unity-setup@v2.6.0
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          modules: windows-mono
          auto-update-hub: false
          cache-installation: true

      - name: Check that the editor starts
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: ./.github/scripts/check-unity-editor.sh --delete-cache-if-broken

  install-unity-fresh:
    # Kører kun hvis cachen var ødelagt (og nu er slettet): installerer forfra på en ren maskine
    # og gemmer en ny, sund cache, som test-jobbene derefter bruger.
    name: Reinstall Unity (cache was broken)
    needs: prepare-unity
    if: ${{ needs.prepare-unity.outputs.healthy != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Unity Hub and Editor
        uses: RageAgainstThePixel/unity-setup@v2.6.0
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          modules: windows-mono
          auto-update-hub: false
          cache-installation: true

      - name: Check that the editor starts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/check-unity-editor.sh --delete-cache-if-broken --fail-if-broken

  unity-tests:
    # EditMode (asset-/prefab-validering) og PlayMode (komponenter i en tom testscene), parallelt.
    name: Unity ${{ matrix.platform }} tests
    needs: [prepare-unity, install-unity-fresh]
    if: ${{ !cancelled() && (needs.prepare-unity.outputs.healthy == 'true' || needs.install-unity-fresh.result == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [EditMode, PlayMode]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Tests-${{ matrix.platform }}-windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Tests-${{ matrix.platform }}-windows-

      - name: Install Unity Hub and Editor (from cache)
        uses: RageAgainstThePixel/unity-setup@v2.6.0
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          modules: windows-mono
          auto-update-hub: false
          cache-installation: true

      - name: Check that the editor starts
        shell: bash
        run: ./.github/scripts/check-unity-editor.sh --fail-if-broken

      - name: Activate Unity license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run ${{ matrix.platform }} tests
        shell: bash
        run: ./.github/scripts/run-unity-tests.sh ${{ matrix.platform }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.platform }}-test-results
          path: results
          if-no-files-found: warn
