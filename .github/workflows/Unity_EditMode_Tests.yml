name: Unity_EditMode_Tests_v2.0

on:
  push:
    branches: [develop, SCRUM-21-combat-mod-enemies, SCRUM-37-ci-test-til-unity-projekt]
  pull_request:
    branches: [develop, SCRUM-21-combat-mod-enemies]
  workflow_dispatch:
    inputs:
      verify_failure:
        description: "Run the deliberately failing test and expect the runner to report failure"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: EditMode tests (${{ matrix.os }})
    if: ${{ !inputs.verify_failure }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Mono2x-${{ matrix.os }}-EditMode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Mono2x-${{ matrix.os }}-EditMode-

      - name: Install Unity Hub and Editor
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          cache-installation: true

      - name: Activate Unity license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run EditMode tests
        shell: bash
        run: |
          mkdir -p results
          editor_path="$UNITY_EDITOR_PATH"
          if [ "$RUNNER_OS" = "Windows" ]; then
            editor_path="$(cygpath -u "$UNITY_EDITOR_PATH")"
          fi
          set +e
          "$editor_path" -batchmode -nographics -projectPath "$PWD" \
            -scriptingBackend Mono2x \
            -runTests -testPlatform EditMode \
            -testCategory "!ShouldFail" \
            -testResults "$PWD/results/editmode-results.xml" \
            -logFile -
          code=$?
          echo "Unity exited with code $code"
          if [ "$code" -eq 0 ] && ! grep -q 'total="[1-9]' results/editmode-results.xml; then
            echo "::error::Unity reported success but ran 0 tests."
            exit 1
          fi
          exit $code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results-${{ matrix.os }}
          path: results
          if-no-files-found: warn

  verify-failure:
    name: Pipeline catches failures (${{ matrix.os }})
    if: ${{ inputs.verify_failure }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      - name: Install Unity Hub and Editor
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          cache-installation: true

      - name: Activate Unity license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run deliberate failure test
        shell: bash
        run: |
          mkdir -p results
          editor_path="$UNITY_EDITOR_PATH"
          if [ "$RUNNER_OS" = "Windows" ]; then
            editor_path="$(cygpath -u "$UNITY_EDITOR_PATH")"
          fi
          set +e
          "$editor_path" -batchmode -nographics -projectPath "$PWD" \
            -scriptingBackend Mono2x \
            -runTests -testPlatform EditMode \
            -testCategory "ShouldFail" \
            -testResults "$PWD/results/verify-failure.xml" \
            -logFile -
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "::error::Expected exit code 2 but got $code"
            exit 1
          fi

      - name: Upload failure-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-results-${{ matrix.os }}
          path: results
          if-no-files-found: warn