name: Unity CI Test-v1.2

on:
  push:
    branches: [develop, SCRUM-21-combat-mod-enemies, SCRUM-37-ci-test-til-unity-projekt]
  pull_request:
    branches: [develop, SCRUM-21-combat-mod-enemies]
  workflow_dispatch:
    inputs:
      verify_failure:
        description: "Run the deliberately failing test and expect the runner to report failure"
        type: boolean
        default: false

# Unity is installed directly on the runner (no Docker):
#   unity-setup            -> installs Unity Hub + the Editor from ProjectSettings/ProjectVersion.txt
#                             and exports UNITY_EDITOR_PATH
#   activate-unity-license -> activates a Personal license with the Unity ID in UNITY_EMAIL / UNITY_PASSWORD
#                             (the license is returned automatically when the job ends)
# Tests are then run by calling the Editor directly with -runTests.
#
# Unity exit codes for -runTests: 0 = all passed, 2 = some tests failed, anything else = crash/setup error.

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    if: ${{ !inputs.verify_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: EditMode tests
            platform: EditMode
            category: "!ShouldFail"
            results: editmode-results
          - name: Smoke test (PlayMode)
            platform: PlayMode
            category: "Smoke"
            results: smoke-results
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.platform }}-

      - name: Install Unity Hub and Editor
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          cache-installation: true

      - name: Activate Unity license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run ${{ matrix.platform }} tests
        run: |
          mkdir -p results
          set +e
          "$UNITY_EDITOR_PATH" -batchmode -nographics -projectPath "$PWD" \
            -runTests -testPlatform ${{ matrix.platform }} \
            -testCategory "${{ matrix.category }}" \
            -testResults "$PWD/results/${{ matrix.results }}.xml" \
            -logFile -
          code=$?
          echo "Unity exited with code $code"
          if [ "$code" -eq 0 ] && ! grep -q 'total="[1-9]' "results/${{ matrix.results }}.xml"; then
            echo "::error::Unity reported success but ran 0 tests - check the -testCategory filter."
            exit 1
          fi
          exit $code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.results }}
          path: results
          if-no-files-found: warn

  verify-failure:
    name: Pipeline catches failures
    if: ${{ inputs.verify_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      - name: Install Unity Hub and Editor
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          cache-installation: true

      - name: Activate Unity license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run the deliberately failing test (must fail with exit code 2)
        run: |
          mkdir -p results
          set +e
          "$UNITY_EDITOR_PATH" -batchmode -nographics -projectPath "$PWD" \
            -runTests -testPlatform EditMode \
            -testCategory "ShouldFail" \
            -testResults "$PWD/results/verify-failure.xml" \
            -logFile -
          code=$?
          echo "Unity exited with code $code"
          if [ "$code" -eq 2 ]; then
            echo "OK: Unity reported the failing test, so the pipeline detects failures."
          else
            echo "::error::Expected exit code 2 (test failure) but got $code"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-results
          path: results
          if-no-files-found: warn