name: Unity CI Test-v1.1

on:
  push:
    branch: [develop, SCRUM-21-combat-mod-enemies]
  pull_request:
    branch: [develop, SCRUM-21-combat-mod-enemies]
  workflow_dispatch:
    inputs:
      verify_failure:
        description: "Run the deliberately failing test and expect the runner to report failure"
        type: boolean
        default: false

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  editmode:
    name: EditMode tests
    if: ${{ !inputs.verify_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }


      - name: Install Unity CLI
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          unity --version

      - name: Install Unity Editor
        run: |
          unity install "$UNITY_EDITOR_VERSION" --yes --accept-eula
          unity editors -i

      - name: Activate license
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          EDITOR_PATH=$(unity editors -i --format json | jq -r --arg v "$UNITY_EDITOR_VERSION" '.[] | select(.version==$v) | .path' | head -n1)
          if [ -z "$EDITOR_PATH" ]; then
            EDITOR_PATH=$(find /opt /home -name Unity -type f 2>/dev/null | head -n1)
          fi
          echo "Using editor: $EDITOR_PATH"
          "$EDITOR_PATH" -batchmode -nographics -quit \
            -LICENSE "$UNITY_LICENSE" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -logFile -

      - name: Run EditMode tests
        run: |
          unity test "$GITHUB_WORKSPACE" \
            --editor-version "$UNITY_EDITOR_VERSION" \
            --mode EditMode \
            --output "$GITHUB_WORKSPACE/test-results.xml" \
            --report-format nunit,junit \
            --allow-install \
            --timeout 600 \
            --format github \
            -- \
            -nographics

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: |
            test-results.xml
            test-results.junit.xml
            Logs/**
          if-no-files-found: warn

      - name: Return license
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          EDITOR_PATH=$(unity editors -i --format json | jq -r --arg v "$UNITY_EDITOR_VERSION" '.[] | select(.version==$v) | .path' | head -n1)
          if [ -z "$EDITOR_PATH" ]; then
            EDITOR_PATH=$(find /opt /home -name Unity -type f 2>/dev/null | head -n1)
          fi
          echo "Returning license with: $EDITOR_PATH"
          "$EDITOR_PATH" -batchmode -nographics -quit \
            -returnlicense \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -logFile - || true

  smoke:
    name: Smoke test (PlayMode)
    if: ${{ !inputs.verify_failure }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        with:
          testMode: playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customParameters: -testCategory "Smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: artifacts

  verify-failure:
    name: Pipeline catches failures
    if: ${{ inputs.verify_failure }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - id: run
        uses: game-ci/unity-test-runner@v4
        continue-on-error: true
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customParameters: -testCategory "ShouldFail"
      - name: Require the runner to have failed
        if: steps.run.outcome == 'success'
        run: |
          echo "::error::Deliberately failing test did not fail the pipeline!"
          exit 1




